name: Recover aggregate evidence and verify live API
on:
  push:
    branches: [main]
    paths: ["requests/recover.json"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: aggregate-data-evidence
          run-id: 42118098139
          github-token: ${{ github.token }}
          path: recovered
      - run: python scripts/recover_evidence.py
      - run: python scripts/smoke_live.py
        env:
          CUTOVER_API_BASE: https://cutover-h77imel3y-mekala27-45s-projects.vercel.app
          CUTOVER_EXPECTED_COMMIT: 0be1cddd03ab4fd0f93aa43b3a3f4caeee055aff
      - run: python scripts/load_live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-aggregate-and-live
          path: recovered/
