[project]
name = "cutover"
version = "0.1.0"
description = "Evidence-bound vehicle complaint triage and release evaluation"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.12,<3", "fastapi==0.162.0", "uvicorn==0.54.0",
  "scikit-learn==1.9.1", "numpy>=2.2,<3", "scipy>=1.15,<2",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "jinja2>=3.1,<4",
  "datasketch>=1.6,<2", "openpyxl>=3.1,<4", "pyarrow>=19,<25"
]
[project.optional-dependencies]
encoder = ["sentence-transformers==6.2.0", "onnxruntime==1.31.1", "onnx>=1.18,<2", "transformers==5.22.1"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "hypothesis>=6,<7", "ruff>=0.14,<1", "mypy>=1.18,<2", "types-openpyxl"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E","F","I","UP","B"]
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
[tool.coverage.run]
source = ["packages"]

[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["packages*"]
